[package]
name = "opsearch-companion"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "opsearch_companion"
path = "src/lib.rs"

[[bin]]
name = "opsearch-companion"
path = "src/main.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"

[dev-dependencies]
tempfile = "=3.27.0"
